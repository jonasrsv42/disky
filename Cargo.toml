[package]
name = "disky"
version = "0.1.0"
edition = "2024"
description = "A Rust implementation of the Riegeli file format"
authors = ["Jonas Valfridsson jonasrsv42@gmail.com"]
license = "Apache-2.0"

[features]
# Parallel implementation using multiple threads for improved performance
parallel = ["dep:crossbeam-channel"]
# Random number generation support (enables RandomRepeatingShardSource)
random = ["dep:rand"]
# Zstd compression support
zstd = ["dep:zstd"]

[dependencies]
thiserror = "2.0.18"
bytes = "1.11.1"
highway = "1.1.0"
log = "0.4.20"
env_logger = "0.11.9"
rand = { version = "0.10.0", optional = true }
zstd = { version = "0.13", optional = true }
crossbeam-channel = { version = "0.5", optional = true }

[dev-dependencies]
tempfile = "3.10.1"
criterion = "0.8.2"

[[bench]]
name = "record_io_bench"
harness = false

[[bench]]
name = "parallel_reader_bench"
harness = false
required-features = ["parallel"]

[[bench]]
name = "parallel_writer_bench"
harness = false
required-features = ["parallel"]

[[bench]]
name = "tree_reader_bench"
harness = false
